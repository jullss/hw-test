services:
  postgres:
    image: postgres:16
    container_name: calendar-test-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-calendar}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-calendar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: calendar-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: build/Dockerfile.migrate
    container_name: calendar-test-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-calendar}?sslmode=disable"
    volumes:
      - ../migrations:/migrations
    command: ["-dir", "/migrations", "up"]
    restart: on-failure

  calendar:
    build:
      context: ..
      dockerfile: build/Dockerfile
    container_name: calendar-test-app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      CALENDAR_LOGGER_LEVEL: info
      CALENDAR_LISTEN_HOST: "0.0.0.0"
      CALENDAR_LISTEN_PORT: "8888"
      CALENDAR_LISTEN_GRPC_PORT: "50051"
      CALENDAR_STORAGE_TYPE: sql
      CALENDAR_STORAGE_DBURL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-calendar}?sslmode=disable"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/list_day?date=2026-01-01 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure

  scheduler:
    build:
      context: ..
      dockerfile: build/Dockerfile.scheduler
    container_name: calendar-test-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SCHEDULER_LOGGER_LEVEL: info
      SCHEDULER_STORAGE_DBURL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-calendar}?sslmode=disable"
      SCHEDULER_RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/"
      SCHEDULER_RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-calendar_notifications}
      SCHEDULER_SCAN_INTERVAL: "2s"
    restart: on-failure

  sender:
    build:
      context: ..
      dockerfile: build/Dockerfile.sender
    container_name: calendar-test-sender
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SENDER_LOGGER_LEVEL: info
      SENDER_RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/"
      SENDER_RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-calendar_notifications}
      SENDER_RABBITMQ_SENT_QUEUE: ${RABBITMQ_SENT_QUEUE:-calendar_notifications_sent}
    restart: on-failure

  integration-tests:
    build:
      context: ..
      dockerfile: build/Dockerfile.integration
    container_name: calendar-integration-tests
    depends_on:
      calendar:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      sender:
        condition: service_started
      scheduler:
        condition: service_started
    environment:
      CALENDAR_URL: "http://calendar:8888"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/"
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-calendar_notifications}
      RABBITMQ_SENT_QUEUE: ${RABBITMQ_SENT_QUEUE:-calendar_notifications_sent}
